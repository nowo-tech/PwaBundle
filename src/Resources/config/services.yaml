# Bundle service definitions.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\PwaBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../PwaBundle.php'
            - '../../DataCollector/'
            - '../../EventSubscriber/PwaBootstrapStatelessCookieSubscriber.php'
            # Optional Web Push services are registered by PwaExtension only when nowo_pwa.web_push.enabled.
            - '../../WebPush/'
            - '../../Controller/PushTestController.php'

    Nowo\PwaBundle\EventSubscriber\PwaBootstrapStatelessCookieSubscriber:
        arguments:
            $enabled: '%nowo_pwa.http.strip_set_cookie_on_bootstrap%'
            $bootstrapPaths: '%nowo_pwa.bootstrap_paths%'
        tags:
            - { name: kernel.event_subscriber }

    Nowo\PwaBundle\Controller\:
        resource: '../../Controller/'
        exclude: '../../Controller/PushTestController.php'
        public: true

    Nowo\PwaBundle\Routing\PwaRouteLoader:
        arguments:
            $routes: '%nowo_pwa.routes%'
            $routePrefix: '%nowo_pwa.route_prefix%'
            $pushTestEnabled: '%nowo_pwa.web_push.test_notification.enabled%'
        tags:
            - { name: routing.loader }

    Nowo\PwaBundle\Controller\PwaController:
        public: true
        arguments:
            $enabled: '%nowo_pwa.enabled%'
            $manifestConfig: '%nowo_pwa.manifest%'
            $serviceWorkerConfig: '%nowo_pwa.service_worker%'
            $httpConfig: '%nowo_pwa.http%'
            $templates: '%nowo_pwa.templates%'
            $routes: '%nowo_pwa.routes%'
            $manifestOverlayProviders: !tagged_iterator nowo_pwa.manifest_overlay_provider

    Nowo\PwaBundle\Twig\PwaTwigExtension:
        arguments:
            $enabled: '%nowo_pwa.enabled%'
            $manifestConfig: '%nowo_pwa.manifest%'
            $metaConfig: '%nowo_pwa.meta%'
            $serviceWorkerConfig: '%nowo_pwa.service_worker%'
            $installPromptConfig: '%nowo_pwa.install_prompt%'
            $installLinksConfig: '%nowo_pwa.install_links%'
            $clientConfig: '%nowo_pwa.client%'
            $routeTargetingConfig: '%nowo_pwa.route_targeting%'
            $templates: '%nowo_pwa.templates%'
            $routes: '%nowo_pwa.routes%'

    Nowo\PwaBundle\Twig\PwaWebPushTwigExtension:
        arguments:
            $config: '%nowo_pwa.web_push.client%'
            $sender: '@?Nowo\PwaBundle\WebPush\WebPushSenderInterface'
            $csrfTokenManager: '@?security.csrf.token_manager'
